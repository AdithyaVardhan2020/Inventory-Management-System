<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Login</title>
    <style>
        body {
            font-family: Segoe UI, Tahoma, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
            width: 100%;
            max-width: 400px;
        }
        h1 { margin-top: 0; color: #1e3a5f; }
        label { display: block; margin-bottom: 1rem; font-size: .9rem; }
        input {
            width: 100%;
            padding: .5rem;
            margin-top: .25rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: .75rem;
            background: #1e3a5f;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background: #2a5080; }
        .status { margin-top: 1rem; font-size: .9rem; }
        .error { color: #c0392b; }
        .success { color: #27ae60; }
        a { color: #1e3a5f; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Inventory Login</h1>
        <form id="login-form">
            <label>Username
                <input type="text" id="username" value="admin" required>
            </label>
            <label>Password
                <input type="password" id="password" value="admin123" required>
            </label>
            <button type="submit">Login</button>
        </form>
        <p id="status" class="status"></p>
        <p><a href="dashboard.html">Go to Dashboard</a></p>
    </div>
    <script>
        const API = 'http://localhost:8080';
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            status.textContent = 'Logging in...';
            status.className = 'status';
            try {
                const res = await fetch(API + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const text = await res.text();
                if (text === 'Login successful') {
                    sessionStorage.setItem('loggedIn', 'true');
                    status.textContent = 'Success! Redirecting...';
                    status.className = 'status success';
                    window.location.href = 'dashboard.html';
                } else {
                    status.textContent = text || 'Invalid credentials';
                    status.className = 'status error';
                }
            } catch (err) {
                status.textContent = 'Cannot reach backend. Start Spring Boot on port 8080.';
                status.className = 'status error';
            }
        });
    </script>
</body>
</html>
